name: CB-Partner CI

on:
  push:
    branches:
      - feature/dynamic-ui
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - feature/dynamic-ui
  workflow_dispatch:
    inputs:
      verification:
        description: 'Choose the checks to run (full uses more Actions minutes)'
        required: true
        type: choice
        default: quick
        options:
          - quick
          - android
          - web
          - ios
          - full

permissions:
  contents: read

# Keep only the latest run for this branch. A newer push cancels stale work.
concurrency:
  group: cb-partner-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-regression:
    name: Shared JVM regression tests
    if: ${{ github.event_name == 'push' || inputs.verification == 'quick' || inputs.verification == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: |
          ./gradlew --stacktrace \
            :core:jvmTest \
            :domain:jvmTest \
            :data:jvmTest \
            :navigation:jvmTest \
            :feature:splash:jvmTest \
            :feature:dynamic:jvmTest

  android:
    name: Android unit tests and debug build
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.verification == 'android' || inputs.verification == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests and assemble debug app
        run: ./gradlew --stacktrace :androidApp:testDebugUnitTest :androidApp:assembleDebug

  web:
    name: Web browser tests and production Wasm build
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.verification == 'web' || inputs.verification == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Run Web browser tests and production build
        run: |
          ./gradlew --stacktrace \
            :webApp:wasmJsBrowserTest \
            :webApp:wasmJsBrowserProductionWebpack

  ios:
    name: iOS simulator tests and framework build
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.verification == 'ios' || inputs.verification == 'full') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Run iOS simulator tests and link app framework
        run: |
          ./gradlew --stacktrace \
            :core:iosSimulatorArm64Test \
            :domain:iosSimulatorArm64Test \
            :network:iosSimulatorArm64Test \
            :data:iosSimulatorArm64Test \
            :navigation:iosSimulatorArm64Test \
            :app:iosSimulatorArm64Test \
            :feature:splash:iosSimulatorArm64Test \
            :feature:dynamic:iosSimulatorArm64Test \
            :app:linkDebugFrameworkIosSimulatorArm64
