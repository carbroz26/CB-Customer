name: CB-Partner CI

on:
  push:
    branches:
      - feature/dynamic-ui
  pull_request:
    branches:
      - feature/dynamic-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cb-partner-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JVM unit tests
        run: >-
          ./gradlew
          :core:jvmTest
          :domain:jvmTest
          :data:jvmTest
          :navigation:jvmTest
          :feature:splash:jvmTest
          :feature:dynamic:jvmTest

  web-wasm-build:
    name: Web Wasm production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Web Wasm production bundle
        run: ./gradlew :webApp:wasmJsBrowserProductionWebpack
